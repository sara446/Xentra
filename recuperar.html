<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña - Xentra Inventory Pro</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/estilos.css">

</head>

<body>
    <main class="login-container">
        <div class="login-card recovery-card">
            <!-- ENCABEZADO -->
            <div class="registro-header">
                <a href="index.html" class="back-button">
                    <i class="bi bi-chevron-left"></i>
                </a>
                <h1>
                    Recuperar contraseña
                </h1>
            </div>
            <!-- TÍTULO -->
            <div class="registro-title">
                <h2>
                    ¿Olvidaste tu contraseña?
                </h2>
                <p>
                    Ingresa tu correo electrónico para recuperar tu cuenta.
                </p>
            </div>
            <!-- FORMULARIO -->
            <form id="recuperarForm">
                <div class="form-group">
                    <label for="correoRecuperacion">
                        Correo electrónico
                    </label>
                    <input
                        type="email"
                        id="correoRecuperacion"
                        class="form-control"
                        placeholder="soporte@xentra.com"
                        required>
                </div>
                <button
                    type="submit"
                    class="btn-login">
                    Enviar enlace de recuperación
                </button>
                <div class="register-container registro-login">
                    <span>
                        ¿Recordaste tu contraseña?
                    </span>
                    <a href="index.html">
                        Iniciar sesión
                    </a>
                </div>
            </form>
            <!-- NAVEGACIÓN MÓVIL -->
            <div class="bottom-navigation">
                <button
                    type="button"
                    onclick="window.location.href='index.html'">
                    <i class="bi bi-arrow-left"></i>
                </button>
                <button
                    type="button"
                    onclick="window.location.href='index.html'">
                    <i class="bi bi-house"></i>
                </button>
                <button type="button">
                    <i class="bi bi-person-circle"></i>
                </button>
            </div>
        </div>
    </main>
    <!-- MODAL -->
    <div id="modalRecuperacion" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-icon">
                <i class="bi bi-envelope-check"></i>
            </div>
            <h2>
                Correo enviado
            </h2>
            <p>
                Si el correo está registrado, recibirás
                instrucciones para recuperar tu contraseña.
            </p>
            <button
                id="modalRecuperacionBoton"
                class="modal-button"
                type="button">
                Volver al inicio
            </button>
        </div>
    </div>
    <script src="js/recuperar.js"></script>
</body>
</html>
