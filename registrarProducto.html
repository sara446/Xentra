<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar producto - Xentra Inventory Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <main class="principal-container">
        <div class="principal-card">
            <div class="dashboard-main product-detail-main">
                <header class="product-detail-header">
                    <a href="inventario.html" class="product-back-button" title="Volver al inventario">
                        <i class="bi bi-chevron-left"></i>
                    </a>
                    <h1>Registrar producto</h1>
                </header>
                <section class="product-detail-card">
                    <div class="registro-title">
                        <h2>Nuevo Producto</h2>
                        <p>Introduce los datos para dar de alta un producto</p>
                    </div>
                    <form id="registrarProductoForm">
                        <div class="form-group">
                            <label for="nombreProducto">Nombre del producto</label>
                            <input type="text" id="nombreProducto" class="form-control"
                                placeholder="Teclado Mecánico RGB" required>
                        </div>
                        <div class="form-group">
                            <label for="codigoProducto">Código de barra o referencia</label>
                            <input type="text" id="codigoProducto" class="form-control" placeholder="TEC-MEC-RGB"
                                required>
                        </div>
                        <div class="form-group">
                            <label for="categoriaProducto">Categoría</label>
                            <div class="select-container">
                                <select id="categoriaProducto" class="form-control" required>
                                    <option value="Accesorios de Oficina">Accesorios de Oficina</option>
                                    <option value="Electrónica">Electrónica</option>
                                    <option value="Mobiliario">Mobiliario</option>
                                    <option value="Papelería">Papelería</option>
                                </select>
                                <i class="bi bi-chevron-down select-icon"></i>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="cantidadInicial">Cantidad inicial</label>
                                <input type="number" id="cantidadInicial" class="form-control" placeholder="25" min="0"
                                    required>
                            </div>
                            <div class="form-group">
                                <label for="stockMinimo">Stock mínimo</label>
                                <input type="number" id="stockMinimo" class="form-control" placeholder="5" min="0"
                                    required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="ubicacionProducto">Ubicación en almacén (Opcional)</label>
                            <input type="text" id="ubicacionProducto" class="form-control" placeholder="Estante A-10">
                        </div>
                        <button type="submit" class="btn-login">
                            Guardar producto
                        </button>
                    </form>
                </section>
            </div>
            <nav class="dashboard-navigation">
                <div class="sidebar-brand">
                    <div class="logo-box">
                        <i class="bi bi-box-seam"></i>
                    </div>
                    <span class="sidebar-brand-name">Xentra</span>
                </div>
                <a href="principal.html" class="dashboard-nav-item">
                    <i class="bi bi-house-fill"></i>
                    <span>Inicio</span>
                </a>
                <a href="inventario.html" class="dashboard-nav-item active">
                    <i class="bi bi-box-seam"></i>
                    <span>Inventario</span>
                </a>
                <a href="movimientos.html" class="dashboard-nav-item">
                    <i class="bi bi-arrow-down-up"></i>
                    <span>Movimientos</span>
                </a>
                <a href="alertas.html" class="dashboard-nav-item">
                    <i class="bi bi-bell"></i>
                    <span>Alertas</span>
                </a>
                <a href="perfil.html" class="dashboard-nav-item">
                    <i class="bi bi-person"></i>
                    <span>Perfil</span>
                </a>
            </nav>
            <div class="mobile-dashboard-navigation">
                <a href="principal.html" class="mobile-nav-item">
                    <i class="bi bi-house"></i>
                    <span>Inicio</span>
                </a>
                <a href="inventario.html" class="mobile-nav-item active">
                    <span class="mobile-nav-active-icon">
                        <i class="bi bi-box-seam-fill"></i>
                    </span>
                    <span>Inventario</span>
                </a>
                <a href="movimientos.html" class="mobile-nav-item">
                    <i class="bi bi-activity"></i>
                    <span>Movimientos</span>
                </a>
                <a href="alertas.html" class="mobile-nav-item">
                    <i class="bi bi-bell"></i>
                    <span>Alertas</span>
                </a>
                <a href="perfil.html" class="mobile-nav-item">
                    <i class="bi bi-person"></i>
                    <span>Perfil</span>
                </a>
            </div>
        </div>
    </main>
    <script src="js/registrar-producto.js"></script>
</body>

</html>
