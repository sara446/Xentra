<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xentra - Inventory Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <main class="login-container">
        <div class="login-card">
            <div class="logo-container">
                <div class="logo-box">
                    <i class="bi bi-box-seam"></i>
                </div>
                <h1 class="brand-name">Xentra</h1>
                <span class="brand-subtitle">
                    INVENTORY PRO
                </span>
            </div>
            <div class="welcome-section">
                <h2>Bienvenido de nuevo</h2>
                <p>
                    Ingresa tus credenciales para acceder
                </p>
            </div>
            <form id="loginForm">
                <!-- Usuario -->
                <div class="form-group">
                    <label for="usuario">
                        Usuario o Correo Electrónico
                    </label>
                    <input type="text" id="usuario" class="form-control" placeholder="soporte@xentra.com" required>
                </div>
                <!-- Contraseña -->
                <div class="form-group">
                    <label for="password">
                        Contraseña
                    </label>
                    <div class="password-container">
                        <input type="password" id="password" class="form-control" placeholder="••••••••••" required>
                        <button type="button" id="togglePassword" class="password-button">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <!-- Recuperar contraseña -->
                <div class="forgot-container">
                    <a href="recuperar.html">
                        ¿Olvidaste tu contraseña?
                    </a>
                </div>
                <!-- Botón -->
                <button type="submit" class="btn-login">
                    Iniciar sesión
                </button>
                <!-- Registro -->
                <div class="register-container">
                    <span>
                        ¿No tienes una cuenta?
                    </span>
                    <a href="registro.html">
                        Regístrate
                    </a>
                </div>
            </form>
            <!-- Navegación inferior -->
            <div class="bottom-navigation">
                <button type="button">
                    <i class="bi bi-arrow-left"></i>
                </button>
                <button type="button">
                    <i class="bi bi-house"></i>
                </button>
                <button type="button">
                    <i class="bi bi-person-circle"></i>
                </button>
            </div>
        </div>
    </main>
    <!-- =========================================
     MODAL
========================================= -->
    <div id="modalMensaje" class="modal-overlay">
        <div class="modal-box">
            <div id="modalIcono" class="modal-icon">
                <i class="bi bi-check-lg"></i>
            </div>
            <h2 id="modalTitulo">
                Inicio exitoso
            </h2>
            <p id="modalMensajeTexto">
                Bienvenido a Xentra.
            </p>
            <button type="button" id="modalBoton" class="modal-button">
                OK
            </button>
        </div>
    </div>
    <!-- JavaScript -->
    <script src="js/login.js"></script>
</body>

</html>
