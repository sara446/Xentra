<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar movimiento - Xentra Inventory Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <main class="principal-container">
        <div class="principal-card">
            <div class="dashboard-main product-detail-main">
                <header class="product-detail-header">
                    <a href="movimientos.html" class="product-back-button" title="Volver al historial">
                        <i class="bi bi-chevron-left"></i>
                    </a>
                    <h1>Registrar movimiento</h1>
                </header>
                <section class="product-detail-card">
                    <div class="registro-title">
                        <h2>Nuevo Movimiento</h2>
                        <p>Registra una entrada o salida de inventario</p>
                    </div>
                    <form id="registrarMovimientoForm">
                        <div class="form-group">
                            <label for="productoMovimiento">Producto</label>
                            <div class="select-container">
                                <select id="productoMovimiento" class="form-control" required>
                                    <option value="Laptop Dell Vostro 3400">Laptop Dell Vostro 3400</option>
                                    <option value="Mouse Inalámbrico Logitech">Mouse Inalámbrico Logitech</option>
                                    <option value="Monitor LG Pro 27&quot;">Monitor LG Pro 27"</option>
                                    <option value="Cable HDMI 4K 1.8m">Cable HDMI 4K 1.8m</option>
                                </select>
                                <i class="bi bi-chevron-down select-icon"></i>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Tipo de movimiento</label>
                            <input type="hidden" id="tipoMovimiento" value="entrada">
                            <div class="form-row">
                                <button type="button" class="movement-type-button selected in" data-tipo="entrada">
                                    <i class="bi bi-arrow-down-left"></i>
                                    Entrada
                                </button>
                                <button type="button" class="movement-type-button" data-tipo="salida">
                                    <i class="bi bi-arrow-up-right"></i>
                                    Salida
                                </button>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="cantidadMovimiento">Cantidad</label>
                                <input type="number" id="cantidadMovimiento" class="form-control" placeholder="5"
                                    min="1" required>
                            </div>
                            <div class="form-group">
                                <label for="fechaMovimiento">Fecha</label>
                                <input type="date" id="fechaMovimiento" class="form-control" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="observacionMovimiento">Observación (Opcional)</label>
                            <input type="text" id="observacionMovimiento" class="form-control"
                                placeholder="Abastecimiento de stock de laptops">
                        </div>
                        <button type="submit" class="btn-login">
                            Registrar movimiento
                        </button>
                    </form>
                </section>
            </div>
            <nav class="dashboard-navigation">
                <div class="sidebar-brand">
                    <div class="logo-box">
                        <i class="bi bi-box-seam"></i>
                    </div>
                    <span class="sidebar-brand-name">Xentra</span>
                </div>
                <a href="principal.html" class="dashboard-nav-item">
                    <i class="bi bi-house-fill"></i>
                    <span>Inicio</span>
                </a>
                <a href="inventario.html" class="dashboard-nav-item">
                    <i class="bi bi-box-seam"></i>
                    <span>Inventario</span>
                </a>
                <a href="movimientos.html" class="dashboard-nav-item active">
                    <i class="bi bi-arrow-down-up"></i>
                    <span>Movimientos</span>
                </a>
                <a href="alertas.html" class="dashboard-nav-item">
                    <i class="bi bi-bell"></i>
                    <span>Alertas</span>
                </a>
                <a href="perfil.html" class="dashboard-nav-item">
                    <i class="bi bi-person"></i>
                    <span>Perfil</span>
                </a>
            </nav>
            <div class="mobile-dashboard-navigation">
                <a href="principal.html" class="mobile-nav-item">
                    <i class="bi bi-house"></i>
                    <span>Inicio</span>
                </a>
                <a href="inventario.html" class="mobile-nav-item">
                    <i class="bi bi-box-seam"></i>
                    <span>Inventario</span>
                </a>
                <a href="movimientos.html" class="mobile-nav-item active">
                    <span class="mobile-nav-active-icon">
                        <i class="bi bi-arrow-down-up"></i>
                    </span>
                    <span>Movimientos</span>
                </a>
                <a href="alertas.html" class="mobile-nav-item">
                    <i class="bi bi-bell"></i>
                    <span>Alertas</span>
                </a>
                <a href="perfil.html" class="mobile-nav-item">
                    <i class="bi bi-person"></i>
                    <span>Perfil</span>
                </a>
            </div>
        </div>
    </main>

    <!-- MODAL DE CONFIRMACIÓN -->
    <div id="modalMensaje" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-icon">
                <i class="bi bi-check-lg"></i>
            </div>
            <h2>Movimiento registrado</h2>
            <p>La operación se ha guardado de forma exitosa en el sistema.</p>
            <div class="product-detail-card modal-summary-card">
                <div class="product-information-row">
                    <span>PRODUCTO</span>
                    <strong id="modalProducto">—</strong>
                </div>
                <div class="product-divider"></div>
                <div class="product-stock-section">
                    <div>
                        <span>TIPO</span>
                        <strong id="modalTipo">—</strong>
                    </div>
                    <div class="product-minimum">
                        <span>CANTIDAD</span>
                        <strong id="modalCantidad">—</strong>
                    </div>
                </div>
            </div>
            <button type="button" id="modalBoton" class="modal-button">
                Volver al historial
            </button>
        </div>
    </div>

    <script src="js/registrar-movimiento.js"></script>
</body>

</html>
