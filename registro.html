<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0"
    >

    <title>Registro - Xentra Inventory Pro</title>

    <!-- Bootstrap -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link 
        rel="stylesheet" 
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- CSS propio -->
    <link rel="stylesheet" href="css/estilos.css">

</head>


<body>

    <main class="login-container">

        <div class="login-card registro-card">


            <!-- =====================================
                 ENCABEZADO
            ====================================== -->

            <div class="registro-header">

                <a href="index.html" class="back-button">
                    <i class="bi bi-chevron-left"></i>
                </a>

                <h1>
                    Registro Xentra
                </h1>

            </div>


            <!-- =====================================
                 TÍTULO
            ====================================== -->

            <div class="registro-title">

                <h2>
                    Crear nueva cuenta
                </h2>

                <p>
                    Completa el formulario para registrarte
                </p>

            </div>


            <!-- =====================================
                 FORMULARIO
            ====================================== -->

            <form id="registroForm">


                <!-- Nombre completo -->

                <div class="form-group">

                    <label for="nombre">
                        Nombre completo
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        class="form-control"
                        placeholder="Juan Pérez"
                        required
                    >

                </div>


                <!-- Correo -->

                <div class="form-group">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        class="form-control"
                        placeholder="juan.perez@correo.com"
                        required
                    >

                </div>


                <!-- Contraseña -->

                <div class="form-group">

                    <label for="registroPassword">
                        Contraseña
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="registroPassword"
                            class="form-control"
                            placeholder="Crea una contraseña"
                            required
                        >

                        <button
                            type="button"
                            class="password-button"
                            onclick="mostrarPassword('registroPassword', this)"
                        >

                            <i class="bi bi-eye"></i>

                        </button>

                    </div>

                </div>


                <!-- Confirmar contraseña -->

                <div class="form-group">

                    <label for="confirmarPassword">
                        Confirmar contraseña
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="confirmarPassword"
                            class="form-control"
                            placeholder="Repite tu contraseña"
                            required
                        >

                        <button
                            type="button"
                            class="password-button"
                            onclick="mostrarPassword('confirmarPassword', this)"
                        >

                            <i class="bi bi-eye"></i>

                        </button>

                    </div>

                </div>


                <!-- Rol -->

                <div class="form-group">

                    <label for="rol">
                        Rol
                    </label>

                    <div class="select-container">

                        <select
                            id="rol"
                            class="form-control"
                            required
                        >

                            <option value="Administrador de Inventario">
                                Administrador de Inventario
                            </option>

                            <option value="Empleado">
                                Empleado
                            </option>

                            <option value="Supervisor">
                                Supervisor
                            </option>

                        </select>

                        <i class="bi bi-chevron-down select-icon"></i>

                    </div>

                </div>


                <!-- =====================================
                     BOTÓN
                ====================================== -->

                <button
                    type="submit"
                    class="btn-login registro-button"
                >

                    Crear cuenta

                </button>


                <!-- =====================================
                     IR AL LOGIN
                ====================================== -->

                <div class="register-container registro-login">

                    <span>
                        ¿Ya tienes una cuenta?
                    </span>

                    <a href="index.html">
                        Iniciar sesión
                    </a>

                </div>


            </form>


            <!-- =====================================
                 NAVEGACIÓN INFERIOR
                 SOLO CELULAR
            ====================================== -->

            <div class="bottom-navigation">

                <button
                    type="button"
                    onclick="window.location.href='index.html'"
                >
                    <i class="bi bi-arrow-left"></i>
                </button>


                <button
                    type="button"
                    onclick="window.location.href='index.html'"
                >
                    <i class="bi bi-house"></i>
                </button>


                <button type="button">
                    <i class="bi bi-person-circle"></i>
                </button>

            </div>


        </div>

    </main>


    <!-- JavaScript -->
    <script src="js/registro.js"></script>

</body>

</html>
